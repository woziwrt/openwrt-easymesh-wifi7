#
# Every upstream revision an image is built from, in one place.
#
# A build is reproducible only if all of these are fixed: the upstream feeds
# follow branches, so "the same build script" a month later fetches different
# code. Each value can be overridden from the environment for a trial build,
# e.g. MTK_COMMIT=<sha> ./build-bpi-r4.sh - such a build is then no longer the
# tested one.

# OpenWrt, branch openwrt-25.12 (kernel 6.12.108 at this pin)
OPENWRT_URL=${OPENWRT_URL:-https://github.com/openwrt/openwrt.git}
OPENWRT_BRANCH=${OPENWRT_BRANCH:-openwrt-25.12}
OPENWRT_COMMIT=${OPENWRT_COMMIT:-9facdff6fb001b7a4e8cea395b89278fd49ca92f}

# MediaTek OpenWrt feeds (mt76, hostapd, Wi-Fi 7 driver and firmware, autobuild)
MTK_URL=${MTK_URL:-https://github.com/mediatek/mtk-openwrt-feeds}
MTK_BRANCH=${MTK_BRANCH:-main}
MTK_COMMIT=${MTK_COMMIT:-e55f4f30d66b2a99c5a1b75bdc2f22bf6c756243}

# iopsys Multi-AP stack (ieee1905, map-agent, map-controller, libwifi, wifimngr).
# Upstream is used as-is at IOPSYS_BASE; our changes are the files under
# iopsys/overlay/, copied on top. IOPSYS_TREE is the git tree the result must
# have - if it differs, a file was lost or changed on the way and the build stops.
IOPSYS_URL=${IOPSYS_URL:-https://dev.iopsys.eu/feed/iopsys.git}
IOPSYS_BASE=${IOPSYS_BASE:-b08b41db08205314345da9fd62c2ba4f20ad84cd}
IOPSYS_TREE=${IOPSYS_TREE:-1a688f2e9990f18072a0b34723cf0d01c088510b}

# MTK autobuild profile shared by both boards
AUTOBUILD_TARGET=${AUTOBUILD_TARGET:-filogic-mac80211-mt798x_rfb-wifi7_nic}

# modemdata (modem status scripts used by luci-app-modemdata). Fetched, not
# carried in this repository: upstream publishes it without a license, so it
# is not ours to redistribute. extras/modemdata-addons/ is added on top.
MODEMDATA_URL=${MODEMDATA_URL:-https://github.com/obsy/modemdata}
MODEMDATA_BRANCH=${MODEMDATA_BRANCH:-main}
MODEMDATA_COMMIT=${MODEMDATA_COMMIT:-7da0adc29c0d5e5f6676c212c2b3c3ade2ddfd9e}
