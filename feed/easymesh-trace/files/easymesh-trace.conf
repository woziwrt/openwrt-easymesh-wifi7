#
# easymesh trace - knobs, read by /usr/share/easymesh/trace.sh on every run.
#
# This file is a conffile: it survives an upgrade, so a box left in a cheap
# mode stays there.
#
#   ET_ENABLE=1        record everything. Adds roughly half a second to every
#                      script in the boot chain - a boot takes about a minute
#                      longer, and timing-dependent behaviour can shift.
#   ET_ENABLE=0        record nothing. The hooks stay in place and cost a few
#                      milliseconds, so switching back is one word.
#   ET_ONLY_TAGS       space-separated globs, matched on the script name.
#                      These are recorded even with ET_ENABLE=0 - the way to
#                      look inside three scripts while the boot runs at its
#                      normal speed.
#   ET_XTRACE=0        keep the records and the state snapshots, drop the
#                      line-by-line trace.
#   ET_PS4_TIME=1      timestamp every traced line. One fork per line: tens of
#                      seconds across a boot. For one script, never for a boot.
#   ET_KEEP_BOOTS      how many previous boots to keep (default 10).
#   ET_MINFREE_MB      stop writing rather than fill the rootfs (default 48).

# Installed and off. Measured 2026-08-19: with ET_ENABLE=1 baked into an image
# the boot chain went from about a minute to eleven, because every script in it
# pays for two full state snapshots. That is a fine price while hunting and a
# terrible one to hand somebody on a router.
#
# Turning it on is one word and one reboot, and it can be narrowed to the two
# or three scripts in question with ET_ONLY_TAGS without slowing the rest.
ET_ENABLE=0
ET_ONLY_TAGS=""
